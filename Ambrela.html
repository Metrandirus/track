<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AMBRELA – Подбор трековой системы</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Контейнер для вывода результатов подбора -->
    <div id="resultContainer" class="result-container">
      <table class="results-table" id="resultsTable">
        <thead>
          <tr>
            <th>Наименование</th>
            <th>Кол.</th>
            <th>Цена за шт.</th>
            <th>Общая цена</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <div id="totalPrice" class="total-price"></div>
      <button id="addToCartFromAmbrela" class="add-to-cart-button">В корзину</button>
    </div>
    <div id="debug" class="debug"></div>
  </div>

  <!-- Подключаем общие утилиты и скрипт производителя -->
  <script src="utils.js"></script>
  <script src="ambrela.js"></script>
</body>
</html>
