<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Подбор трековой системы</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Подключаем jQuery и jQuery UI (для сортировки производителей и диалогового окна) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <style>
    /* Стили для всей страницы */
    body {
      font-family: Arial, sans-serif;
      background-color: #e7f5fd;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Шапка страницы */
    #headerRow {
      width: 100%;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #headerRow h1 {
      margin: 0;
      font-size: 20px;
    }
    /* Кнопка "Корзина" – расположена в правом верхнем углу */
    #cartButton {
      position: absolute;
      right: 20px;
      top: 10px;
      background-color: #000;
      color: #fff;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
    }
    /* Окно "Все производители" остаётся без изменений */
    #manufacturerControlsContainer {
      position: absolute;
      right: 120px;
      top: 10px;
      width: 200px;
      border: 1px solid #ddd;
      background-color: #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      display: none;
    }
    #manufacturerHeader {
      background-color: #f4f4f4;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    #manufacturerControls {
      display: none;
      padding: 10px;
    }
    #manufacturerControls label {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
    }
    /* Основной контейнер для формы и производителей */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }
    /* Остальные стили для формы, производителей и т.д. остаются без изменений */
    /* ... */
  </style>
</head>
<body>
  <!-- Шапка страницы -->
  <div id="headerRow">
    <h1>Подбор трековой системы</h1>
    <!-- Кнопка "Корзина" в шапке, которая сразу открывает модальное окно -->
    <button id="cartButton" onclick="openCartModal()">Корзина</button>
    <div id="manufacturerControlsContainer">
      <div id="manufacturerHeader">Все производители</div>
      <div id="manufacturerControls">
        <div id="manufacturerCheckboxes"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Левая область: форма выбора -->
    <div class="form-container">
      <!-- Ваш код формы выбора остается без изменений -->
      <!-- ... -->
    </div>
    <!-- Правая область: блок с производителями -->
    <div class="manufacturers-container" id="manufacturersContainer">
      <!-- Здесь будут динамически создаваться столбцы производителей -->
    </div>
  </div>

  <!-- Модальное окно корзины (jQuery UI Dialog) -->
  <div id="cartDialog" title="Корзина" style="display:none;">
    <iframe id="cartIframe" src="cart.html" style="width:100%; height:400px; border:none;"></iframe>
  </div>

  <script>
    /* Функция для открытия модального окна корзины */
    function openCartModal() {
      $("#cartDialog").dialog("open");
    }

    /* Инициализация модального окна корзины через jQuery UI Dialog */
    $(document).ready(function() {
      $("#cartDialog").dialog({
        autoOpen: false,
        modal: true,
        width: 800,
        minWidth: 600,
        minHeight: 300,
        resizable: true
      });
    });
    
    /* Остальной код (форма, сортировка производителей и т.д.) остается без изменений */
    /* ... */
  </script>
</body>
</html>
