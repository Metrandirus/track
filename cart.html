<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Корзина</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Можно подключать jQuery/UI, если необходимо -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #e7f5fd;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      table-layout: auto;
      margin-top: 10px;
    }
    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      font-size: 13px;
      text-align: left;
      vertical-align: middle;
    }
    .results-table th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
    /* Первая колонка – артикул */
    .results-table th:nth-child(1),
    .results-table td:nth-child(1) {
      width: 100px;
      text-align: center;
    }
    .results-table img {
      width: 50px;
      height: auto;
      margin-right: 8px;
      vertical-align: middle;
    }
    .total-price {
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
      font-size: 14px;
    }
    .debug {
      font-size: 12px;
      color: red;
      margin-top: 10px;
      text-align: center;
    }
    .delete-button, .clear-cart-button, .refresh-cart-button {
      background-color: #000;
      color: #fff;
      border: none;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      margin-top: 5px;
    }
    .delete-button:hover,
    .clear-cart-button:hover,
    .refresh-cart-button:hover {
      background-color: #333;
    }
    .delete-button {
      padding: 4px 8px;
      font-size: 12px;
    }
    .buttons-row {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Корзина</h1>
    <div id="cartContent"><!-- Здесь будет таблица корзины --></div>
    <div id="totalPrice" class="total-price"></div>
    <div class="buttons-row">
      <button class="refresh-cart-button" onclick="loadCart()">Обновить корзину</button>
      <button class="clear-cart-button" onclick="clearCart()">Очистить корзину</button>
    </div>
    <div id="debug" class="debug"></div>
  </div>
  
  <script>
    function loadCart() {
      let cart = [];
      const debugDiv = document.getElementById("debug");
      try {
        if (localStorage.getItem("cart")) {
          cart = JSON.parse(localStorage.getItem("cart"));
        }
      } catch (e) {
        debugDiv.textContent = "Ошибка чтения корзины.";
        return;
      }

      let html = "";
      if (cart.length === 0) {
        html = "<p style='text-align:center;'>Корзина пуста</p>";
        document.getElementById("cartContent").innerHTML = html;
        document.getElementById("totalPrice").textContent = "";
        return;
      }

      html += `<table class="results-table">
        <thead>
          <tr>
            <th>Артикул</th>
            <th>Наименование</th>
            <th>Кол.</th>
            <th>Цена за шт.</th>
            <th>Общая цена</th>
            <th>Действие</th>
          </tr>
        </thead>
        <tbody>`;

      let overallTotal = 0;
      cart.forEach((item, index) => {
        // article – то, что сохранено в поле article
        // component – объект { name, price, image }
        const article = item.article || (item.component && item.component.id) || "N/A";
        const comp = item.component || {};
        const name = comp.name || "Товар";
        // Если в component уже прописано "Название (артикул)", убираем повтор, НО:
        // Обычно в brand-файле формируется { name: "...", image: "...", price: ... } без артикула
        // Так что здесь мы делаем "name (article)" сами
        const image = comp.image || "";
        const unitPrice = parseFloat(comp.price) || 0;
        const count = parseInt(item.count) || 1;
        const total = unitPrice * count;
        overallTotal += total;

        html += `
          <tr>
            <td style="text-align:center;">${article}</td>
            <td>
              <img src="${image}" alt="${name}" onerror="this.style.display='none'">
              ${name}
            </td>
            <td style="text-align:center;">${count} шт.</td>
            <td>${unitPrice}₽</td>
            <td>${total}₽</td>
            <td style="text-align:center;">
              <button class="delete-button" onclick="deleteCartItem(${index})">Удалить</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>
        <div class="total-price">Итоговая стоимость: ${overallTotal.toFixed(2)}₽</div>`;

      document.getElementById("cartContent").innerHTML = html;
    }

    function deleteCartItem(index) {
      let cart = [];
      try {
        if (localStorage.getItem("cart")) {
          cart = JSON.parse(localStorage.getItem("cart"));
        }
      } catch (e) {
        alert("Ошибка чтения корзины.");
        return;
      }
      if (index >= 0 && index < cart.length) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
      }
    }

    function clearCart() {
      if (confirm("Вы действительно хотите очистить корзину?")) {
        localStorage.setItem("cart", "[]");
        loadCart();
      }
    }

    document.addEventListener("DOMContentLoaded", loadCart);
  </script>
</body>
</html>
