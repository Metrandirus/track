<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Корзина</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Подключаем jQuery и jQuery UI для функционала изменения размера -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #e7f5fd;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      table-layout: auto;
      margin-top: 10px;
    }
    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: left;
      font-size: 13px;
    }
    .results-table th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
    .results-table th:nth-child(2),
    .results-table td:nth-child(2) {
      width: 60px;
      text-align: center;
    }
    .results-table th:nth-child(3),
    .results-table td:nth-child(3) {
      width: 90px;
    }
    .results-table th:nth-child(4),
    .results-table td:nth-child(4) {
      width: 100px;
    }
    .results-table img {
      width: 50px;
      height: auto;
      margin-right: 10px;
      vertical-align: middle;
    }
    .total-price {
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
      font-size: 14px;
    }
    .debug {
      font-size: 12px;
      color: red;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Корзина</h1>
    <div id="cartContent">
      <!-- Здесь будет динамически сформированная таблица с товарами -->
    </div>
    <div id="debug" class="debug"></div>
  </div>
  
  <script>
    // Функция загрузки корзины и отрисовки таблицы
    function loadCart() {
      let cart = [];
      const debugDiv = document.getElementById("debug");
      try {
        if (localStorage.getItem("cart")) {
          cart = JSON.parse(localStorage.getItem("cart"));
        }
      } catch (e) {
        debugDiv.textContent = "Ошибка чтения корзины.";
        return;
      }
      
      let html = "";
      if (cart.length === 0) {
        html = "<p style='text-align:center;'>Корзина пуста</p>";
      } else {
        html += `<table class="results-table">
          <thead>
            <tr>
              <th>Наименование</th>
              <th>Кол.</th>
              <th>Цена за шт.</th>
              <th>Общая цена</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody>`;
        let overallTotal = 0;
        cart.forEach((item, index) => {
          // Предполагается, что каждый элемент корзины – это объект с полями:
          // item.component, item.count
          const comp = item.component || {};
          const name = comp.name || "Товар";
          const image = comp.image || "";
          const unitPrice = parseFloat(comp.price) || 0;
          const count = parseInt(item.count) || 1;
          const total = unitPrice * count;
          overallTotal += total;
          html += `<tr>
            <td><img src="${image}" alt="${name}">${name}</td>
            <td style="text-align:center;">${count} шт.</td>
            <td>${unitPrice}₽</td>
            <td>${total}₽</td>
            <td style="text-align:center;"><button class="delete-button" onclick="deleteCartItem(${index})">Удалить</button></td>
          </tr>`;
        });
        html += `</tbody>
        </table>
        <div class="total-price">Итоговая стоимость: ${overallTotal.toFixed(2)}₽</div>`;
      }
      document.getElementById("cartContent").innerHTML = html;
    }
    
    // Функция удаления товара из корзины по индексу
    function deleteCartItem(index) {
      let cart = [];
      try {
        if (localStorage.getItem("cart")) {
          cart = JSON.parse(localStorage.getItem("cart"));
        }
      } catch (e) {
        alert("Ошибка чтения корзины.");
        return;
      }
      if (index >= 0 && index < cart.length) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
      }
    }
    
    // Обновляем корзину при событии pageshow (каждый раз, когда страница становится активной)
    window.addEventListener("pageshow", loadCart);
    
    // Также вызываем loadCart при загрузке
    document.addEventListener("DOMContentLoaded", loadCart);
    
    // Делаем окно корзины изменяемым (resizable) с помощью jQuery UI
    $(document).ready(function(){
      $("#cartContent").resizable({
        // Опционально: минимальные размеры
        minWidth: 400,
        minHeight: 300,
        // Можно добавить другие опции
      });
    });
  </script>
</body>
</html>
