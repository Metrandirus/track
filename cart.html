<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Корзина</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e7f5fd;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background-color: #fff;
      padding: 20px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    .total-price {
      text-align: right;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .empty-cart {
      text-align: center;
      font-size: 18px;
    }
    .clear-button {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    .selection-title {
      background-color: #ddd;
      font-weight: bold;
      text-align: center;
    }
    img {
      width: 50px;
      vertical-align: middle;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Корзина</h1>
    <div id="cartContainer"></div>
    <button class="clear-button" onclick="clearCart()">Очистить корзину</button>
  </div>
  
  <script>
    // Функция для отображения товаров из корзины
    function displayCart() {
      let cartData = localStorage.getItem("cart");
      let cartContainer = document.getElementById("cartContainer");
      
      if (!cartData) {
        cartContainer.innerHTML = '<p class="empty-cart">Корзина пуста.</p>';
        return;
      }
      
      let cart = JSON.parse(cartData);
      
      if (!Array.isArray(cart) || cart.length === 0) {
        cartContainer.innerHTML = '<p class="empty-cart">Корзина пуста.</p>';
        return;
      }
      
      let html = '<table><thead><tr><th>Наименование</th><th>Количество</th><th>Цена за шт.</th><th>Общая цена</th></tr></thead><tbody>';
      let grandTotal = 0;
      
      // В корзине может быть несколько наборов (selection)
      cart.forEach((selection, selectionIndex) => {
        html += `<tr><td colspan="4" class="selection-title">Выбор №${selectionIndex + 1}</td></tr>`;
        // Проходим по всем ключам объекта selection
        Object.keys(selection).forEach(id => {
          let group = selection[id];
          if (!group) return;
          let comp = group.component;
          if (!comp || !comp.name) return;
          
          let qty = 0;
          // Если это трек (имеется длина)
          if (group.isTrack && group.totalLength > 0) {
            // Определяем номинальную длину для расчёта количества
            let nominal = 1;
            if (id.indexOf("-111") !== -1) {
              nominal = 100;
            } else if (id.indexOf("-112") !== -1) {
              nominal = 200;
            } else if (id.indexOf("-113") !== -1) {
              nominal = 300;
            }
            qty = Math.ceil(group.totalLength / nominal);
          } else {
            qty = group.count;
          }
          
          let cost = qty * comp.price;
          grandTotal += cost;
          
          html += `<tr>
            <td><img src="${comp.image}" alt="${comp.name}"> ${comp.name} (${id})</td>
            <td>${qty} шт.</td>
            <td>${comp.price}₽</td>
            <td>${cost}₽</td>
          </tr>`;
        });
      });
      
      html += '</tbody></table>';
      html += `<div class="total-price">Итого: ${grandTotal}₽</div>`;
      
      cartContainer.innerHTML = html;
    }
    
    // Функция для очистки корзины
    function clearCart() {
      localStorage.removeItem("cart");
      displayCart();
    }
    
    window.onload = displayCart;
  </script>
</body>
</html>
