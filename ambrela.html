<!DOCTYPE html>
<html lang="ru">
<head>

  <style>
    /* Общие стили для ambrela.html */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #e7f5fd;
      overflow: visible;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      height: auto;
      overflow: visible;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background-color: white;
      table-layout: auto;
    }
    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: left;
      word-wrap: break-word;
      font-size: 13px;
      vertical-align: middle;
    }
    .results-table th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
    /* Первая колонка – Артикул (выводится один раз) */
    .results-table th:nth-child(1),
    .results-table td:nth-child(1) {
      width: 100px;
      text-align: center;
    }
    /* Колонки для цены и количества */
    .results-table th:nth-child(3),
    .results-table td:nth-child(3) {
      width: 90px;
    }
    .results-table th:nth-child(2),
    .results-table td:nth-child(2) {
      width: 40px;
      text-align: center;
    }
    .results-table img {
      width: 50px;
      height: auto;
      margin-right: 10px;
      vertical-align: middle;
    }
    .total-price {
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
      font-size: 14px;
    }
    .debug {
      font-size: 12px;
      color: red;
      margin-top: 10px;
    }
    .add-to-cart-button {
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 3px;
    }
    .add-to-cart-button:hover {
      background-color: #333;
    }
  </style>
</head>

    // Добавляем для X-образной системы: X-коннекторы
    // Если выбран X-фигура, то для чёрного добавляем "GL7172 BK", для белого – "GL7171 WH".
    function addXConnector(selectedItems, color) {
      let xConnectorId = (color === "black") ? "GL7172 BK" : "GL7171 WH";
      selectedItems.push({ id: xConnectorId });
    }
    
    /***** Функции расчёта трековых сегментов для AMBRELA *****/
    function getTracksForAmbrela(legLength, lengthOptions) {
      let pieces = [];
      if (lengthOptions.length === 2) {
        // Для recessed: доступны только варианты 1м и 2м.
        if (legLength <= 100) {
          pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
        } else if (legLength <= 200) {
          pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
        } else {
          let fullPieces = Math.floor(legLength / 200);
          for (let i = 0; i < fullPieces; i++) {
            pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
          }
          let remainder = legLength - fullPieces * 200;
          if (remainder > 0) {
            if (remainder <= 100) {
              pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
            } else {
              pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
            }
          }
        }
      } else {
        // Для вариантов с тремя длинами (surface, stretch-ceiling, hanging)
        if (legLength <= 100) {
          pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
        } else if (legLength <= 200) {
          pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
        } else if (legLength <= 300) {
          pieces.push({ id: lengthOptions[2].items[0], pieceLength: 300 });
        } else {
          let fullPieces = Math.floor(legLength / 300);
          for (let i = 0; i < fullPieces; i++) {
            pieces.push({ id: lengthOptions[2].items[0], pieceLength: 300 });
          }
          let remainder = legLength - fullPieces * 300;
          if (remainder > 0) {
            if (remainder <= 100) {
              pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
            } else if (remainder <= 200) {
              pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
            } else {
              pieces.push({ id: lengthOptions[2].items[0], pieceLength: 300 });
            }
          }
        }
      }
      return pieces;
    }
    function getTracksForAmbrelaRecessed(legLength, lengthOptions) {
      return getTracksForAmbrela(legLength, lengthOptions);
    }
    function getTracksForAmbrelaSurface(legLength, lengthOptions) {
      return getTracksForAmbrela(legLength, lengthOptions);
    }
    
    // Функция определения номинальной длины трека для AMBRELA.
    function getNominalLength(id) {
      if (id.indexOf("7102") !== -1 || id.indexOf("7101") !== -1) return 100;
      if (id.indexOf("7104") !== -1 || id.indexOf("7103") !== -1) return 200;
      if (id.indexOf("7106") !== -1) return 300;
      if (id.indexOf("7122") !== -1 || id.indexOf("7121") !== -1) return 100;
      if (id.indexOf("7124") !== -1 || id.indexOf("7123") !== -1) return 200;
      return 100; // Значение по умолчанию
    }
    
    // Глобальная функция safeShowSelection для AMBRELA
    window.safeShowSelection = function() {
      try {
        showSelection();
      } catch (e) {

        alert("Произошла ошибка при подборе. Проверьте консоль для подробностей.");
      }
    };
    
    /***** Основная функция подбора для AMBRELA *****/
    window.showSelection = function() {
      console.log("Начало работы showSelection (AMBRELA)");
      
      const params = new URLSearchParams(window.location.search);
      const color = (params.get("color") || "black").toLowerCase();
      let mountingParam = (params.get("mounting") || "surface").toLowerCase();
      if (!checkMountingForStLuce(mountingParam)) {
        return;
      }
      const shape = params.get("shape") || "straight";
      const lengthA = parseFloat(params.get("lengthA")) || 150;
      const lengthB = parseFloat(params.get("lengthB")) || 0;
      
      console.log("Параметры подбора (AMBRELA):", { color, mounting: mountingParam, shape, lengthA, lengthB });
      
      let effectiveProduct = (mountingParam === "stretch-ceiling" || mountingParam === "hanging") ?
          (products.ambrela && products.ambrela[color] && products.ambrela[color]["surface"]) :
          (products.ambrela && products.ambrela[color] && products.ambrela[color][mountingParam]);
      if (!effectiveProduct) {
        throw new Error("Не найден комплект для AMBRELA с выбранными параметрами.");
      }
      
      let components = effectiveProduct.components;
      if (mountingParam === "stretch-ceiling") {
        const ceilingProduct = products.ambrela[color]["stretch-ceiling"];
        if (ceilingProduct && ceilingProduct.components) {
          components = Object.assign({}, components, ceilingProduct.components);
        }
      }
      
      const lengthOptions = effectiveProduct.lengthOptions;
      let selectedItems = [];
      let usedConnectors = [];
      
      // Логика подбора по фигурам
      if (shape === "straight") {
        if (mountingParam === "recessed") {
          selectedItems = getTracksForAmbrelaRecessed(lengthA, lengthOptions);
        } else {
          selectedItems = getTracksForAmbrelaSurface(lengthA, lengthOptions);
        }
      } else if (shape === "L-shape") {
        let legATracks, legBTracks;
        if (mountingParam === "recessed") {
          legATracks = getTracksForAmbrelaRecessed(lengthA, lengthOptions);
          legBTracks = getTracksForAmbrelaRecessed(lengthB, lengthOptions);
        } else {
          legATracks = getTracksForAmbrelaSurface(lengthA, lengthOptions);
          legBTracks = getTracksForAmbrelaSurface(lengthB, lengthOptions);
        }
        selectedItems = legATracks.concat(legBTracks);
        if (effectiveProduct.connectors["L-shape"] && effectiveProduct.connectors["L-shape"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
        }
      } else if (shape === "T-shape") {
        let topTracks, verticalTracks;
        if (mountingParam === "recessed") {
          topTracks = getTracksForAmbrelaRecessed(lengthA, lengthOptions);
          verticalTracks = getTracksForAmbrelaRecessed(lengthB, lengthOptions);
        } else {
          topTracks = getTracksForAmbrelaSurface(lengthA, lengthOptions);
          verticalTracks = getTracksForAmbrelaSurface(lengthB, lengthOptions);
        }
        selectedItems = topTracks.concat(verticalTracks);
        if (effectiveProduct.connectors["T-shape"] && effectiveProduct.connectors["T-shape"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["T-shape"][0]));
        }
        if (topTracks.length > 1) {
          for (let i = 0; i < topTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (verticalTracks.length > 1) {
          for (let i = 0; i < verticalTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      } else if (shape === "P-shape") {
        let sideTracks = (mountingParam === "recessed") ?
            getTracksForAmbrelaRecessed(lengthA, lengthOptions) :
            getTracksForAmbrelaSurface(lengthA, lengthOptions);
        let connectingTracks = (mountingParam === "recessed") ?
            getTracksForAmbrelaRecessed(lengthB, lengthOptions) :
            getTracksForAmbrelaSurface(lengthB, lengthOptions);
        selectedItems = sideTracks.concat(sideTracks, connectingTracks);
        if (effectiveProduct.connectors["L-shape"] && effectiveProduct.connectors["L-shape"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
        }
        if (sideTracks.length > 1) {
          for (let i = 0; i < sideTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (connectingTracks.length > 1) {
          for (let i = 0; i < connectingTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      } else if (shape === "rectangle") {
        let tracksA = (mountingParam === "recessed") ?
            getTracksForAmbrelaRecessed(lengthA, lengthOptions) :
            getTracksForAmbrelaSurface(lengthA, lengthOptions);
        let tracksB = (mountingParam === "recessed") ?
            getTracksForAmbrelaRecessed(lengthB, lengthOptions) :
            getTracksForAmbrelaSurface(lengthB, lengthOptions);
        selectedItems = tracksA.concat(tracksA, tracksB, tracksB);
        if (effectiveProduct.connectors["L-shape"] && effectiveProduct.connectors["L-shape"].length > 0) {
          for (let i = 0; i < 4; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
          }
        }
        let straightForA = (tracksA.length > 1) ? (tracksA.length - 1) : 0;
        let straightForB = (tracksB.length > 1) ? (tracksB.length - 1) : 0;
        for (let i = 0; i < straightForA + straightForB; i++) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
        }
      } else if (shape === "x") {
        // Если выбран X-образный вариант: собираем трековые сегменты и добавляем дополнительный X-коннектор
        let busbarA = getTracksForAmbrelaSurface(lengthA, lengthOptions);
        let busbarB = getTracksForAmbrelaSurface(lengthB, lengthOptions);
        selectedItems = busbarA.concat(busbarB);
        // Если в данных задан X‑образный коннектор, используем его (если нет, добавляем дополнительный)
        if (effectiveProduct.connectors["x"] && effectiveProduct.connectors["x"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["x"][0]));
        }
        // Дополнительный X‑коннектор: для черного — "GL7172 BK", для белого — "GL7171 WH"
        addXConnector(selectedItems, color);
      } else {
        throw new Error("Логика для фигуры '" + shape + "' не реализована для AMBRELA.");
      }
      
      // Для "straight" – добавляем недостающие прямые коннекторы
      if (shape === "straight") {
        let trackPieces = selectedItems.filter(item => item.hasOwnProperty("pieceLength"));
        let neededStraight = (trackPieces.length > 1) ? trackPieces.length - 1 : 0;
        let currentStraight = usedConnectors.filter(conn => conn.id === effectiveProduct.connectors.straight[0]).length;
        let missing = neededStraight - currentStraight;
        if (missing > 0) {
          for (let i = 0; i < missing; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      }
      
      console.log("Подобранные треки (до доп. компонентов):", selectedItems);
      
      /***** Добавление выбранных светильников *****/
      let lightsParam = params.get("lights") || "[]";
      let selectedLightingOptions;
      try {
        selectedLightingOptions = JSON.parse(lightsParam);
      } catch (e) {
        selectedLightingOptions = [];
      }
      selectedLightingOptions.forEach(light => {
        // Для AMBRELA допустим та же логика, что и для Maytoni (если нужны изменения – можно добавить аналогичные условия)
        let lightItem = (typeof lightingMappingMayontech !== "undefined" && lightingMappingMayontech[light.type] && lightingMappingMayontech[light.type][color])
                          ? lightingMappingMayontech[light.type][color]
                          : null;
        if (lightItem) {
          for (let i = 0; i < parseInt(light.quantity, 10); i++) {
            selectedItems.push({ id: lightItem.id });
            if (!components[lightItem.id]) {
              components[lightItem.id] = {
                name: lightItem.name,
                price: lightItem.price,
                image: lightItem.image
              };
            }
          }
        }
      });
      
      /***** Дополнительные компоненты по режимам монтажа *****/
      if (mountingParam === "stretch-ceiling") {
        let effectiveTrackLength = 0;
        if (shape === "straight") {
          effectiveTrackLength = lengthA;
        } else if (["L-shape", "T-shape", "P-shape", "x"].includes(shape)) {
          effectiveTrackLength = lengthA + lengthB;
        } else if (shape === "rectangle") {
          effectiveTrackLength = 2 * (lengthA + lengthB);
        } else {
          effectiveTrackLength = lengthA + lengthB;
        }
        console.log("Эффективная длина трековой системы (stretch-ceiling):", effectiveTrackLength, "см");
        let profileCount = Math.ceil(effectiveTrackLength / 200);
        console.log("Профилей для добавления (stretch-ceiling):", profileCount);
        let profileId = (color === "black") ? "135191" : "135192";
        for (let i = 0; i < profileCount; i++) {
          selectedItems.push({ id: profileId, pieceLength: 200 });
        }
        let capCount = 0;
        if (shape === "T-shape") {
          capCount = 3;
        } else if (shape === "x") {
          capCount = 4;
        } else if (["straight", "L-shape", "P-shape", "rectangle"].includes(shape)) {
          capCount = 2;
        }
        let capId = (color === "black") ? "135187" : "135188";
        for (let i = 0; i < capCount; i++) {
          selectedItems.push({ id: capId });
        }
      } else if (mountingParam === "recessed") {
        let effectiveTrackLength = 0;
        if (shape === "straight") {
          effectiveTrackLength = lengthA;
        } else if (["L-shape", "T-shape", "P-shape", "x"].includes(shape)) {
          effectiveTrackLength = lengthA + lengthB;
        } else if (shape === "rectangle") {
          effectiveTrackLength = 2 * (lengthA + lengthB);
        } else {
          effectiveTrackLength = lengthA + lengthB;
        }
        console.log("Эффективная длина трековой системы (recessed):", effectiveTrackLength, "см");
        let profileCount = Math.ceil(effectiveTrackLength / 100);
        console.log("Встраиваемых профилей для добавления (recessed):", profileCount);
        for (let i = 0; i < profileCount; i++) {
          selectedItems.push({ id: "358090", pieceLength: 100 });
        }
        if (profileCount > 1) {
          let connectorCount = profileCount - 1;
          for (let i = 0; i < connectorCount; i++) {
            selectedItems.push({ id: "358233" });
          }
        }
      }
      
      if (mountingParam === "hanging") {
        let effectiveTrackLength = 0;
        if (shape === "straight") {
          effectiveTrackLength = lengthA;
        } else if (["L-shape", "T-shape", "P-shape", "x"].includes(shape)) {
          effectiveTrackLength = lengthA + lengthB;
        } else if (shape === "rectangle") {
          effectiveTrackLength = 2 * (lengthA + lengthB);
        } else {
          effectiveTrackLength = lengthA + lengthB;
        }
        console.log("Эффективная длина трековой системы (hanging):", effectiveTrackLength, "см");
        let suspCount = Math.max(2, 1 + Math.ceil(effectiveTrackLength / 200));
        console.log("Подвесов для добавления (hanging):", suspCount);
        let suspensionId = (color === "black") ? "135152" : "135151";
        for (let i = 0; i < suspCount; i++) {
          selectedItems.push({ id: suspensionId });
        }
      }
      
      console.log("Финальный результат подбора (AMBRELA):", selectedItems);
      
      /***** Группировка элементов *****/
      let groupedItems = {};
      selectedItems.concat(usedConnectors).forEach(itemObj => {
        let id = itemObj.id;
        if (!id) {
          console.warn("Обнаружен элемент без id:", itemObj);
          return;
        }
        let isTrack = itemObj.hasOwnProperty("pieceLength");
        if (!groupedItems[id]) {
          // Сначала ищем компонент в surface, затем в recessed, затем в сопоставлениях
          let comp = (products.ambrela[color]["surface"].components[id]) ||
                     (products.ambrela[color]["recessed"] && products.ambrela[color]["recessed"].components[id]) ||
                     suspensionMappingAmbrela[id] ||
                     additionalMappingAmbrela[id] ||
                     {};
          groupedItems[id] = { totalLength: 0, count: 0, component: comp, isTrack: isTrack };
        }
        if (isTrack) {
          groupedItems[id].totalLength += itemObj.pieceLength;
        }
        groupedItems[id].count++;
      });
      console.log("Сгруппированные элементы (до расчёта итоговых количеств):", groupedItems);
      
      // Пересчитываем итоговое количество для трековых сегментов и сумму заказа.
      let totalPrice = 0;
      let tbodyHTML = "";
      for (const [id, group] of Object.entries(groupedItems)) {
        let comp = group.component;
        if (comp && comp.name) {
          let qty;
          if (group.hasOwnProperty("totalLength") && group.totalLength > 0) {
            let nominal = getNominalLength(id);
            qty = Math.ceil(group.totalLength / nominal);
          } else {
            qty = group.count;
          }
          let cost = qty * comp.price;
          totalPrice += cost;
          // Выводим название товара один раз с указанием артикулы (id)
          tbodyHTML += `
            <tr>
              <td><img src="images/ambrela/${id}.jpg" alt="${comp.name}" style="width:50px; height:auto; margin-right:10px;">${comp.name} (${id})</td>
              <td style="background-color: white; text-align: center;">${qty} шт.</td>
              <td>${comp.price}₽</td>
              <td>${cost}₽</td>
            </tr>
          `;
        } else {
          console.warn("Компонент с ID " + id + " не найден или не имеет имени.");
        }
      }
      
      document.getElementById("results").innerHTML = tbodyHTML;
      document.getElementById("totalPrice").innerHTML = `<div>Итоговая стоимость: ${totalPrice}₽</div>`;
      document.getElementById("resultContainer").style.display = "block";
      console.log("Подбор завершён успешно (AMBRELA).");
      
      // Сохраняем сгруппированные данные в глобальную переменную для последующего добавления в корзину
      window.currentAmbrelaSelection = groupedItems;
    };

    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(window.safeShowSelection, 1000);
    });
    
    /***** Функция для добавления товаров в корзину (Подход A для AMBRELA) *****/
    function addToCartFromAmbrela() {
      if (!window.currentAmbrelaSelection) {
        alert("Нет данных для добавления в корзину.");
        return;
      }
      let cart = [];
      try {
        if (localStorage.getItem("cart")) {
          cart = JSON.parse(localStorage.getItem("cart"));
        }
      } catch (e) {
        alert("Ошибка чтения корзины.");
        return;
      }
      // Преобразуем сгруппированные данные в плоский массив объектов { article, component, count }
      for (const [id, group] of Object.entries(window.currentAmbrelaSelection)) {
        cart.push({
          article: id,  // Артикул, как в исходном id (например, "GL7106 BK")
          component: group.component,
          count: group.count
        });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      alert("Товары добавлены в корзину.");
    }
  </script>
