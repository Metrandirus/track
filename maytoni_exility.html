<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Maytoni Exility – Подбор трековой системы</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Общие стили для maytoni_exility.html */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #e7f5fd;
      overflow: visible;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: visible;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: auto;
    }
    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: left;
      font-size: 13px;
    }
    .results-table th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
    .results-table th:nth-child(3), .results-table td:nth-child(3) {
      width: 90px;
    }
    .results-table th:nth-child(2), .results-table td:nth-child(2) {
      width: 40px;
      text-align: center;
    }
    .total-price {
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
      font-size: 14px;
    }
    .result-container {
      display: none;
      overflow: visible;
    }
    .debug {
      font-size: 12px;
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Контейнер для вывода результатов подбора -->
    <div id="resultContainer" class="result-container">
      <table class="results-table" id="resultsTable">
        <thead id="tableHeader">
          <tr>
            <th>Наименование</th>
            <th>кол.</th>
            <th>Цена за шт.</th>
            <th>Общая цена</th>
          </tr>
        </thead>
        <tbody id="results">
          <!-- Результаты подбора будут выведены здесь -->
        </tbody>
      </table>
      <div id="totalPrice" class="total-price"></div>
    </div>
    <div id="debug" class="debug"></div>
  </div>
  
  <script>
    /***** Встроенные данные для Maytoni Exility (магнитная система) *****/
    // Мы будем использовать тип "magnetic"
    var products = {
      "magnetic": {
        "black": {
          "surface": {
            // Накладные шинопроводы для Exility:
            "lengthOptions": [

            "connectors": {

              "T-shape": ["TRA034CWT-42B"]
              // Для X-образной системы (на накладном монтаже) будем использовать:
              // (будет обрабатываться отдельно)
            },
            "components": {
              "TRX034-411B": { "name": "Шинопровод накладной черный 1м", "price": 1000, "image": "images/novotech/TRX034-411B.png" },
              "TRX034-421B": { "name": "Шинопровод накладной черный 2м", "price": 1800, "image": "images/novotech/TRX034-421B.png" },
              "TRX034-431B": { "name": "Шинопровод накладной черный 3м", "price": 2600, "image": "images/novotech/TRX034-431B.png" },
              "TRA034PC-42B": { "name": "Коннектор питания прямой черный", "price": 300, "image": "images/novotech/TRA034PC-42B.png" }
            }
          },
          "recessed": {
            // Встраиваемые шинопроводы для Exility:
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-421B"] },  // 1м
              { "min": 101, "max": 200, "items": ["TRX034-422B"] },  // 2м
              { "min": 201, "max": 300, "items": ["TRX034-423B"] }   // 3м
            ],
            "connectors": {

            },

              "TRX034-422B": { "name": "Шинопровод встраиваемый черный 2м", "price": 2000, "image": "images/novotech/TRX034-422B.png" },
              "TRX034-423B": { "name": "Шинопровод встраиваемый черный 3м", "price": 2900, "image": "images/novotech/TRX034-423B.png" },

            }
          },
          "stretch-ceiling": {

              { "min": 0, "max": 250, "items": ["TRX034-SCH-422B"] } // 2м вариант
            ],
            "connectors": {
              "straight": ["TRA034PC-42B"],
              "L-shape": ["TRA034PC-42B"],
              "T-shape": ["TRA034CWT-42B"]
            },
            "components": {
              "TRX034-SCH-422B": { "name": "Шинопровод в натяжной потолок черный 2м", "price": 2100, "image": "images/novotech/TRX034-SCH-422B.png" }
            }
          },
          "hanging": {
            // Для подвесного монтажа – можно использовать данные из surface
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-411B"] },
              { "min": 101, "max": 200, "items": ["TRX034-421B"] },
              { "min": 201, "max": 300, "items": ["TRX034-431B"] }
            ],
            "connectors": {
              "straight": ["TRA034PC-42B"],
              "L-shape": ["TRA034PC-42B"],
              "T-shape": ["TRA034CWT-42B"]
            },
            "components": {
              "TRX034-411B": { "name": "Шинопровод накладной черный 1м", "price": 1000, "image": "images/novotech/TRX034-411B.png" },
              "TRX034-421B": { "name": "Шинопровод накладной черный 2м", "price": 1800, "image": "images/novotech/TRX034-421B.png" },
              "TRX034-431B": { "name": "Шинопровод накладной черный 3м", "price": 2600, "image": "images/novotech/TRX034-431B.png" },
              "TRA034PC-42B": { "name": "Коннектор питания прямой черный", "price": 300, "image": "images/novotech/TRA034PC-42B.png" }
            }
          }
        },
        "white": {
          "surface": {
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-411W"] },
              { "min": 101, "max": 200, "items": ["TRX034-421W"] },
              { "min": 201, "max": 300, "items": ["TRX034-431W"] }
            ],
            "connectors": {
              "straight": ["TRA034PC-42W"],
              "L-shape": ["TRA034PC-42W"],
              "T-shape": ["TRA034CWT-42W"]
            },
            "components": {
              "TRX034-411W": { "name": "Шинопровод накладной белый 1м", "price": 1000, "image": "images/novotech/TRX034-411W.png" },
              "TRX034-421W": { "name": "Шинопровод накладной белый 2м", "price": 1800, "image": "images/novotech/TRX034-421W.png" },
              "TRX034-431W": { "name": "Шинопровод накладной белый 3м", "price": 2600, "image": "images/novotech/TRX034-431W.png" },
              "TRA034PC-42W": { "name": "Коннектор питания прямой белый", "price": 300, "image": "images/novotech/TRA034PC-42W.png" }
            }
          },
          "recessed": {
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-421W"] },
              { "min": 101, "max": 200, "items": ["TRX034-422W"] },
              { "min": 201, "max": 300, "items": ["TRX034-423W"] }
            ],
            "connectors": {
              "straight": ["TRA034PC-42W"],
              "L-shape": ["TRA034PC-42W"],
              "T-shape": ["TRA034CWT-42W"]
            },
            "components": {
              "TRX034-421W": { "name": "Шинопровод встраиваемый белый 1м", "price": 1100, "image": "images/novotech/TRX034-421W.png" },
              "TRX034-422W": { "name": "Шинопровод встраиваемый белый 2м", "price": 2000, "image": "images/novotech/TRX034-422W.png" },
              "TRX034-423W": { "name": "Шинопровод встраиваемый белый 3м", "price": 2900, "image": "images/novotech/TRX034-423W.png" },
              "TRA034PC-42W": { "name": "Коннектор питания прямой белый", "price": 300, "image": "images/novotech/TRA034PC-42W.png" }
            }
          },
          "stretch-ceiling": {
            "lengthOptions": [
              { "min": 0, "max": 250, "items": ["TRX034-SCH-422W"] }
            ],
            "connectors": {
              "straight": ["TRA034PC-42W"],
              "L-shape": ["TRA034PC-42W"],
              "T-shape": ["TRA034CWT-42W"]
            },
            "components": {
              "TRX034-SCH-422W": { "name": "Шинопровод в натяжной потолок белый 2м", "price": 2100, "image": "images/novotech/TRX034-SCH-422W.png" }
            }
          },
          "hanging": {
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-411W"] },
              { "min": 101, "max": 200, "items": ["TRX034-421W"] },
              { "min": 201, "max": 300, "items": ["TRX034-431W"] }
            ],
            "connectors": {
              "straight": ["TRA034PC-42W"],
              "L-shape": ["TRA034PC-42W"],
              "T-shape": ["TRA034CWT-42W"]
            },
            "components": {
              "TRX034-411W": { "name": "Шинопровод накладной белый 1м", "price": 1000, "image": "images/novotech/TRX034-411W.png" },
              "TRX034-421W": { "name": "Шинопровод накладной белый 2м", "price": 1800, "image": "images/novotech/TRX034-421W.png" },
              "TRX034-431W": { "name": "Шинопровод накладной белый 3м", "price": 2600, "image": "images/novotech/TRX034-431W.png" },
              "TRA034PC-42W": { "name": "Коннектор питания прямой белый", "price": 300, "image": "images/novotech/TRA034PC-42W.png" }
            }
          }
        }
      }
    };
    
    /***** Дополнительные данные для дополнительных компонентов NOVOTECH *****/
    // Новые компоненты для профилей, заглушек и встраиваемых профилей:
    var additionalMapping = {
      // Профили для натяжного потолка (2 м)
      "135192": { "name": "Профиль для натяжного потолка белый 2м", "price": 6400, "image": "images/novotech/135192.png" },
      "135191": { "name": "Профиль для натяжного потолка черный 2м", "price": 6400, "image": "images/novotech/135191.png" },
      // Заглушки для профиля (фиксированное количество)
      "135188": { "name": "Заглушка для профиля белая", "price": 1100, "image": "images/novotech/135188.png" },
      "135187": { "name": "Заглушка для профиля черная", "price": 1100, "image": "images/novotech/135187.png" },
      // Встраиваемый профиль 1м
      "358090": { "name": "Встраиваемый профиль 1м", "price": 1000, "image": "images/novotech/358090.png" },
      // Соединитель для встраиваемого профиля
      "358233": { "name": "Соединитель для встраиваемого профиля", "price": 99, "image": "images/novotech/358233.png" }
    };
    
    // Глобальная переменная для подвесов NOVOTECH уже определена выше: suspensionMapping

    // Функция для подбора трековых элементов для NOVOTECH (варианты 1м и 2м)
    function getTracksForNovotech(legLength, lengthOptions) {
      let pieces = [];
      if (legLength % 400 === 0) {
        let count = legLength / 200;
        for (let i = 0; i < count; i++) {
          pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
        }
        return pieces;
      }
      if (legLength <= 100) {
        pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
      } else if (legLength <= 200) {
        pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
      } else {
        let fullPieces = Math.floor(legLength / 200);
        for (let i = 0; i < fullPieces; i++) {
          pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
        }
        let remainder = legLength - fullPieces * 200;
        if (remainder > 0) {
          if (remainder <= 100) {
            pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
          } else {
            pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
          }
        }
      }
      return pieces;
    }
    // Для NOVOTECH surface и hanging используем одни и те же данные:
    function getTracksForNovotechSurface(legLength, lengthOptions) {
      return getTracksForNovotech(legLength, lengthOptions);
    }
    function getTracksForNovotechHanging(legLength, lengthOptions) {
      return getTracksForNovotech(legLength, lengthOptions);
    }
    
    function getNominalLength(id) {
      if (id === "135136" || id === "135135") return 100;
      if (id === "135138" || id === "135137") return 200;
      return null;
    }
    
    function wrapConnector(conn) {
      return (typeof conn === "object" && conn !== null && conn.id !== undefined) ? conn : { id: conn };
    }
    
    function checkMountingForNovotech(mountingParam) {
      if (mountingParam !== "surface" && mountingParam !== "hanging" && mountingParam !== "recessed" && mountingParam !== "stretch-ceiling") {
        document.getElementById("resultContainer").style.display = "none";
        document.getElementById("debug").textContent = "Для NOVOTECH доступны режимы surface, hanging, recessed и stretch-ceiling.";
        return false;
      }
      return true;
    }
    
    window.safeShowSelection = function() {
      try {
        showSelection();
      } catch (e) {
        console.error("Ошибка в showSelection:", e);
        alert("Произошла ошибка при подборе. Проверьте консоль для подробностей.");
      }
    };
    
    window.showSelection = function() {
      console.log("Начало работы showSelection (NOVOTECH)");
    
      const params = new URLSearchParams(window.location.search);
      const type = "novotech";
      const color = params.get("color") || "black";
      let mountingParam = params.get("mounting") || "surface";
      if (!checkMountingForNovotech(mountingParam)) return;
    
      const shape = params.get("shape") || "straight";
      const lengthA = parseFloat(params.get("lengthA")) || 150;
      const lengthB = parseFloat(params.get("lengthB")) || 0;
    
      console.log("Параметры подбора (NOVOTECH):", { type, color, mounting: mountingParam, shape, lengthA, lengthB });
    
      // Для NOVOTECH используем данные из surface для всех режимов, если mounting = hanging или surface
      let effectiveProduct = null;
      if (mountingParam === "recessed" || mountingParam === "stretch-ceiling") {
        effectiveProduct = products.novotech[color]["recessed"];
      } else if (mountingParam === "hanging" || mountingParam === "surface") {
        effectiveProduct = products.novotech[color]["surface"];
      }
      if (!effectiveProduct) {
        throw new Error("Не найден комплект для NOVOTECH с выбранными параметрами.");
      }
    
      let components = effectiveProduct.components;
      const lengthOptions = effectiveProduct.lengthOptions;
      let selectedItems = [];
      let usedConnectors = [];
    
      // Расчёт трековых сегментов по фигурам:
      if (shape === "straight") {
        selectedItems = (mountingParam === "hanging") ?
                        getTracksForNovotechHanging(lengthA, lengthOptions) :
                        getTracksForNovotechSurface(lengthA, lengthOptions);
      } else if (shape === "L-shape") {
        let legATracks = getTracksForNovotech(lengthA, lengthOptions);
        let legBTracks = getTracksForNovotech(lengthB, lengthOptions);
        selectedItems = legATracks.concat(legBTracks);
        if (effectiveProduct.connectors["L-shape"] && effectiveProduct.connectors["L-shape"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
        }
        if (legATracks.length > 1) {
          for (let i = 0; i < legATracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (legBTracks.length > 1) {
          for (let i = 0; i < legBTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      } else if (shape === "T-shape") {
        let topTracks = getTracksForNovotech(lengthA, lengthOptions);
        let verticalTracks = getTracksForNovotech(lengthB, lengthOptions);
        selectedItems = topTracks.concat(verticalTracks);
        if (effectiveProduct.connectors["T-shape"] && effectiveProduct.connectors["T-shape"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["T-shape"][0]));
        }
        if (topTracks.length > 1) {
          for (let i = 0; i < topTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (verticalTracks.length > 1) {
          for (let i = 0; i < verticalTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      } else if (shape === "P-shape") {
        let sideTracks = getTracksForNovotech(lengthA, lengthOptions);
        let connectingTracks = getTracksForNovotech(lengthB, lengthOptions);
        selectedItems = sideTracks.concat(sideTracks, connectingTracks);
        if (effectiveProduct.connectors["L-shape"] && effectiveProduct.connectors["L-shape"].length > 0) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
          usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
        }
        if (sideTracks.length > 1) {
          for (let i = 0; i < sideTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (connectingTracks.length > 1) {
          for (let i = 0; i < connectingTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      } else if (shape === "rectangle") {
        let tracksA = getTracksForNovotech(lengthA, lengthOptions);
        let tracksB = getTracksForNovotech(lengthB, lengthOptions);
        selectedItems = tracksA.concat(tracksA, tracksB, tracksB);
        if (effectiveProduct.connectors["L-shape"] && effectiveProduct.connectors["L-shape"].length > 0) {
          for (let i = 0; i < 4; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors["L-shape"][0]));
          }
        }
        let straightForA = (tracksA.length > 1) ? 2 * (tracksA.length - 1) : 0;
        let straightForB = (tracksB.length > 1) ? 2 * (tracksB.length - 1) : 0;
        for (let i = 0; i < straightForA + straightForB; i++) {
          usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
        }
      }
      else if (shape === "x") {
        // X-образная система: два набора шинопроводов, соединённых X-образным коннектором
        let busbarA = getTracksForNovotech(lengthA, lengthOptions);
        let busbarB = getTracksForNovotech(lengthB, lengthOptions);
        selectedItems = busbarA.concat(busbarB);
        // Для X-образной системы используем новые коннекторы: 135145 (белый) или 135146 (черный)
        let xConnector = (color === "black") ? "135146" : "135145";
        usedConnectors.push(wrapConnector(xConnector));
      } else {
        throw new Error("Логика для фигуры '" + shape + "' не реализована для NOVOTECH.");
      }
      
      // Для систем "straight" – добавляем недостающие прямые коннекторы
      if (shape === "straight") {
        let trackPieces = selectedItems.filter(item => item.hasOwnProperty("pieceLength"));
        let neededStraight = (trackPieces.length > 1) ? trackPieces.length - 1 : 0;
        let currentStraight = usedConnectors.filter(conn => conn.id === effectiveProduct.connectors.straight[0]).length;
        let missing = neededStraight - currentStraight;
        if (missing > 0) {
          for (let i = 0; i < missing; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      }
      
      console.log("Подобранные треки (до доп. компонентов):", selectedItems);
      
      /***** Добавление выбранных светильников *****/
      // Предполагаем, что в глобальной переменной selectedLightingOptions (JSON-строка из index) передаются выбранные светильники
      // Например: ?lights=%5B%7B%22type%22%3A%22spot%22%2C%22quantity%22%3A%221%22%7D%5D
      const lightsParam = params.get("lights");
      if (lightsParam) {
        try {
          const lightingOptions = JSON.parse(lightsParam);
          lightingOptions.forEach(light => {
            let lightItem = (lightingMappingMaytoni[light.type] && lightingMappingMaytoni[light.type][color]) ? lightingMappingMaytoni[light.type][color] : null;
            if (lightItem) {
              for (let i = 0; i < parseInt(light.quantity); i++) {
                selectedItems.push({ id: lightItem.id });
                if (!components[lightItem.id]) {
                  components[lightItem.id] = {
                    name: lightItem.name,
                    price: lightItem.price,
                    image: lightItem.image
                  };
                }
              }
            }
          });
        } catch(e) {
          console.error("Ошибка разбора параметра lights:", e);
        }
      }
      
      /***** Дополнительные компоненты по режимам монтажа *****/
      // Для натяжного потолка (stretch-ceiling)
      if (mountingParam === "stretch-ceiling") {
        // Рассчитываем эффективную длину шинопроводов (только те элементы, у которых есть pieceLength)
        let trackLength = selectedItems.reduce((sum, item) => sum + (item.pieceLength || 0), 0);
        console.log("Общая длина треков (stretch-ceiling):", trackLength, "см");
        // Профиль для натяжного потолка имеет длину 200 см
        let profileCount = Math.ceil(trackLength / 200);
        console.log("Профилей для добавления (stretch-ceiling):", profileCount);
        // В зависимости от цвета выбираем нужный профиль:
        let profileId = (color === "black") ? "135191" : "135192";
        for (let i = 0; i < profileCount; i++) {
          selectedItems.push({ id: profileId, pieceLength: 200 });
        }
        // Заглушки для профиля: для прямой/L-образной/P-образной – 2 шт, для T-образной – 3, для X-образной – 4
        let endCapsCount = 0;
        if (shape === "T-shape") {
          endCapsCount = 3;
        } else if (shape === "x") {
          endCapsCount = 4;
        } else if (["straight", "L-shape", "P-shape"].includes(shape)) {
          endCapsCount = 2;
        }
        for (let i = 0; i < endCapsCount; i++) {
          // Для заглушек выбираем: для черного – 135187, для белого – 135188
          let capId = (color === "black") ? "135187" : "135188";
          selectedItems.push({ id: capId });
        }
      }
      // Для встраиваемой системы (recessed)
      else if (mountingParam === "recessed") {
        // Для встраиваемой системы профиль имеет длину 1 м
        let trackLength = selectedItems.reduce((sum, item) => sum + (item.pieceLength || 0), 0);
        console.log("Общая длина треков (recessed):", trackLength, "см");
        let profileCount = Math.ceil(trackLength / 100);
        console.log("Встраиваемых профилей для добавления:", profileCount);
        for (let i = 0; i < profileCount; i++) {
          selectedItems.push({ id: "358090", pieceLength: 100 });
        }
        // Каждое соединение профилей требует соединитель 358233.
        // Если профилей больше 1, то соединителей = количество профилей - 1
        if (profileCount > 1) {
          let connectorCount = profileCount - 1;
          for (let i = 0; i < connectorCount; i++) {
            selectedItems.push({ id: "358233" });
          }
        }
      }
      
      // Для подвесного монтажа (hanging)
      if (mountingParam === "hanging") {
        let trackLength = selectedItems.reduce((sum, item) => sum + (item.pieceLength || 0), 0);
        let suspCount = Math.max(2, 1 + Math.ceil(trackLength / 200));
        console.log("Общая длина треков (hanging):", trackLength, "см, подвесов для добавления:", suspCount);
        // Для подвесного монтажа используем данные из surface – подвесы для Maytoni Exility пока не определены, можно задать по аналогии:
        // Здесь для примера используем коннекторы питания гибкий T-образный (например, TRA034CWT-42B) как подвесы (или можно задать отдельную переменную)
        let suspensionId = (color === "black") ? "TRA034CWT-42B" : "TRA034CWT-42W";
        for (let i = 0; i < suspCount; i++) {
          selectedItems.push({ id: suspensionId });
        }
      }
      
      console.log("Финальный результат подбора (Maytoni Exility):", selectedItems);
      
      /***** Группировка элементов *****/
      let groupedItems = {};
      selectedItems.concat(usedConnectors).forEach(itemObj => {
        let id = itemObj.id;
        if (!id) {
          console.warn("Обнаружен элемент без id:", itemObj);
          return;
        }
        let isTrack = itemObj.hasOwnProperty("pieceLength");
        if (!groupedItems[id]) {
          groupedItems[id] = { totalLength: 0, count: 0, component: (products.magnetic[color]["surface"].components[id]) || (products.magnetic[color]["recessed"] ? products.magnetic[color]["recessed"].components[id] : {}) || additionalMapping[id] || {}, isTrack: isTrack };
        }
        if (isTrack) {
          groupedItems[id].totalLength += itemObj.pieceLength;
        }
        groupedItems[id].count++;
      });
      console.log("Сгруппированные элементы (до расчёта итоговых количеств):", groupedItems);
      
      let totalPrice = 0;
      let tbodyHTML = "";
      for (const [id, group] of Object.entries(groupedItems)) {
        let comp = group.component;
        if (comp && comp.name) {
          let qty;
          if (group.isTrack && group.totalLength > 0) {
            let nominal = getNominalLength(id);
            qty = Math.ceil(group.totalLength / nominal);
          } else {
            qty = group.count;
          }
          let cost = qty * comp.price;
          totalPrice += cost;
          tbodyHTML += `
            <tr>
              <td><img src="images/novotech/${id}.png" alt="${comp.name}" style="width:50px; height:auto; margin-right:10px;">${comp.name} ${id}</td>
              <td style="background-color: white; text-align: center;">${qty} шт.</td>
              <td>${comp.price}₽</td>
              <td>${cost}₽</td>
            </tr>
          `;
        } else {
          console.warn("Компонент с ID " + id + " не найден или не имеет имени.");
        }
      }
      
      document.getElementById("results").innerHTML = tbodyHTML;
      document.getElementById("totalPrice").innerHTML = `<div>Итого: ${totalPrice}₽</div>`;
      document.getElementById("resultContainer").style.display = "block";
      console.log("Подбор завершён успешно (Maytoni Exility).");
    };
    
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(window.safeShowSelection, 1000);
    });
  </script>
</body>
</html>
