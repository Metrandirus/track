<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Maytoni Exility – Подбор трековой системы</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Общие стили для maytoni_exility.html */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #e7f5fd;
      overflow: visible;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: visible;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: auto;
    }
    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: left;
      font-size: 13px;
    }
    .results-table th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
    .results-table th:nth-child(3), .results-table td:nth-child(3) {
      width: 90px;
    }
    .results-table th:nth-child(2), .results-table td:nth-child(2) {
      width: 40px;
      text-align: center;
    }
    .total-price {
      font-weight: bold;
      text-align: right;
      margin-top: 10px;
      font-size: 14px;
    }
    .result-container {
      display: none;
      overflow: visible;
    }
    .debug {
      font-size: 12px;
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Контейнер для вывода результатов подбора -->
    <div id="resultContainer" class="result-container">
      <table class="results-table" id="resultsTable">
        <thead id="tableHeader">
          <tr>
            <th>Наименование</th>
            <th>кол.</th>
            <th>Цена за шт.</th>
            <th>Общая цена</th>
          </tr>
        </thead>
        <tbody id="results">
          <!-- Результаты подбора будут выведены здесь -->
        </tbody>
      </table>
      <div id="totalPrice" class="total-price"></div>
    </div>
    <div id="debug" class="debug"></div>
  </div>
  
  <script>
    /***** Встроенные данные для Maytoni Exility (накладной режим) *****/
    var products = {
      "magnetic": {
        "black": {
          "surface": {
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-411B"] },
              { "min": 101, "max": 200, "items": ["TRX034-412B"] },
              { "min": 201, "max": 300, "items": ["TRX034-413B"] }
            ],
            "connectors": {
              "straight": ["TRA034C-21B"],
              "L-shape": ["TRA034HCL-41B"],
              "T-shape": ["TRA034CT-41B"]
            },
            "powerConnectors": {
              "straight": ["TRA034PC-42B"],
              "L-shape": ["TRA034CPC-42B-15-1"],
              "T-shape": ["TRA034CWT-42B"]
            },
            "components": {
              "TRX034-411B": { "name": "Шинопровод накладной черный 1м", "price": 1000, "image": "images/maytoni_exility/TRX034-411B.jpeg" },
              "TRX034-412B": { "name": "Шинопровод накладной черный 2м", "price": 1800, "image": "images/maytoni_exility/TRX034-412B.jpeg" },
              "TRX034-413B": { "name": "Шинопровод накладной черный 3м", "price": 2600, "image": "images/maytoni_exility/TRX034-413B.jpeg" },
              "TRA034C-21B": { "name": "Коннектор прямой черный", "price": 300, "image": "images/maytoni_exility/TRA034C-21B.jpeg" },
              "TRA034HCL-41B": { "name": "Коннектор угловой черный", "price": 400, "image": "images/maytoni_exility/TRA034HCL-41B.jpeg" },
              "TRA034CT-41B": { "name": "Коннектор Т-образный черный", "price": 500, "image": "images/maytoni_exility/TRA034CT-41B.jpeg" },
              "TRA034PC-42B": { "name": "Коннектор питания прямой черный", "price": 350, "image": "images/maytoni_exility/TRA034PC-42B.jpeg" },
              "TRA034CPC-42B-15-1": { "name": "Коннектор питания угловой черный", "price": 450, "image": "images/maytoni_exility/TRA034CPC-42B-15-1.jpeg" },
              "TRA034CWT-42B": { "name": "Коннектор питания Т-образный черный", "price": 550, "image": "images/maytoni_exility/TRA034CWT-42B.jpeg" },
              "TRA034EC-41B": { "name": "Комплект заглушек черный", "price": 200, "image": "images/maytoni_exility/TRA034EC-41B.jpeg" },
              "TRX034DR4-100B": { "name": "Блок питания черный 100W", "price": 1500, "image": "images/maytoni_exility/TRX034DR4-100B.jpeg" }
            }
          },
          "recessed": {
            // Данные для встраиваемого режима
          },
          "stretch-ceiling": {
            // Данные для натяжного потолка
          },
          "hanging": {
            // Данные для подвесного режима
          }
        },
        "white": {
          "surface": {
            "lengthOptions": [
              { "min": 0, "max": 100, "items": ["TRX034-411W"] },
              { "min": 101, "max": 200, "items": ["TRX034-412W"] },
              { "min": 201, "max": 300, "items": ["TRX034-413W"] }
            ],
            "connectors": {
              "straight": ["TRA034C-21W"],
              "L-shape": ["TRA034HCL-41W"],
              "T-shape": ["TRA034CT-41W"]
            },
            "powerConnectors": {
              "straight": ["TRA034PC-42W"],
              "L-shape": ["TRA034CPC-42W-15-1"],
              "T-shape": ["TRA034CWT-42W"]
            },
            "components": {
              "TRX034-411W": { "name": "Шинопровод накладной белый 1м", "price": 1000, "image": "images/maytoni_exility/TRX034-411W.jpeg" },
              "TRX034-412W": { "name": "Шинопровод накладной белый 2м", "price": 1800, "image": "images/maytoni_exility/TRX034-412W.jpeg" },
              "TRX034-413W": { "name": "Шинопровод накладной белый 3м", "price": 2600, "image": "images/maytoni_exility/TRX034-413W.jpeg" },
              "TRA034C-21W": { "name": "Коннектор прямой белый", "price": 300, "image": "images/maytoni_exility/TRA034C-21W.jpeg" },
              "TRA034HCL-41W": { "name": "Коннектор угловой белый", "price": 400, "image": "images/maytoni_exility/TRA034HCL-41W.jpeg" },
              "TRA034CT-41W": { "name": "Коннектор Т-образный белый", "price": 500, "image": "images/maytoni_exility/TRA034CT-41W.jpeg" },
              "TRA034PC-42W": { "name": "Коннектор питания прямой белый", "price": 350, "image": "images/maytoni_exility/TRA034PC-42W.jpeg" },
              "TRA034CPC-42W-15-1": { "name": "Коннектор питания угловой белый", "price": 450, "image": "images/maytoni_exility/TRA034CPC-42W-15-1.jpeg" },
              "TRA034CWT-42W": { "name": "Коннектор питания Т-образный белый", "price": 550, "image": "images/maytoni_exility/TRA034CWT-42W.jpeg" },
              "TRA034EC-41W": { "name": "Комплект заглушек белый", "price": 200, "image": "images/maytoni_exility/TRA034EC-41W.jpeg" },
              "TRX034DR4-100W": { "name": "Блок питания белый 100W", "price": 1500, "image": "images/maytoni_exility/TRX034DR4-100W.jpeg" }
            }
          },
          "recessed": {
            // Данные для встраиваемого режима
          },
          "stretch-ceiling": {
            // Данные для натяжного потолка
          },
          "hanging": {
            // Данные для подвесного режима
          }
        }
      }
    };

    function getTracksForSurface(length, lengthOptions) {
      let pieces = [];
      if (length <= 100) {
        pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
      } else if (length <= 200) {
        pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
      } else if (length <= 300) {
        pieces.push({ id: lengthOptions[2].items[0], pieceLength: 300 });
      } else {
        let fullPieces = Math.floor(length / 300);
        for (let i = 0; i < fullPieces; i++) {
          pieces.push({ id: lengthOptions[2].items[0], pieceLength: 300 });
        }
        let remainder = length - fullPieces * 300;
        if (remainder > 0) {
          if (remainder <= 100) {
            pieces.push({ id: lengthOptions[0].items[0], pieceLength: 100 });
          } else if (remainder <= 200) {
            pieces.push({ id: lengthOptions[1].items[0], pieceLength: 200 });
          } else {
            pieces.push({ id: lengthOptions[2].items[0], pieceLength: 300 });
          }
        }
      }
      return pieces;
    }

    window.showSelection = function() {
      console.log("Начало работы showSelection (Maytoni Exility)");
      
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type") || "magnetic";
      const color = params.get("color") || "black";
      const mountingParam = params.get("mounting") || "surface";
      const shape = params.get("shape") || "straight";
      const lengthA = parseFloat(params.get("lengthA")) || 150;
      const lengthB = parseFloat(params.get("lengthB")) || 0;

      console.log("Параметры подбора:", { type, color, mounting: mountingParam, shape, lengthA, lengthB });

      let effectiveProduct = products.magnetic[color][mountingParam];
      if (!effectiveProduct) {
        throw new Error("Не найден комплект для выбранных параметров.");
      }

      let components = effectiveProduct.components;
      const lengthOptions = effectiveProduct.lengthOptions;
      let selectedItems = [];
      let usedConnectors = [];

      if (shape === "straight") {
        selectedItems = getTracksForSurface(lengthA, lengthOptions);
        usedConnectors.push(wrapConnector(effectiveProduct.powerConnectors.straight[0]));
      } else if (shape === "L-shape") {
        let legATracks = getTracksForSurface(lengthA, lengthOptions);
        let legBTracks = getTracksForSurface(lengthB, lengthOptions);
        selectedItems = legATracks.concat(legBTracks);
        usedConnectors.push(wrapConnector(effectiveProduct.connectors.L-shape[0]));
        usedConnectors.push(wrapConnector(effectiveProduct.powerConnectors.L-shape[0]));
        if (legATracks.length > 1) {
          for (let i = 0; i < legATracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (legBTracks.length > 1) {
          for (let i = 0; i < legBTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      } else if (shape === "T-shape") {
        let topTracks = getTracksForSurface(lengthA, lengthOptions);
        let verticalTracks = getTracksForSurface(lengthB, lengthOptions);
        selectedItems = topTracks.concat(verticalTracks);
        usedConnectors.push(wrapConnector(effectiveProduct.connectors.T-shape[0]));
        usedConnectors.push(wrapConnector(effectiveProduct.powerConnectors.T-shape[0]));
        if (topTracks.length > 1) {
          for (let i = 0; i < topTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
        if (verticalTracks.length > 1) {
          for (let i = 0; i < verticalTracks.length - 1; i++) {
            usedConnectors.push(wrapConnector(effectiveProduct.connectors.straight[0]));
          }
        }
      }

      // Добавляем комплект заглушек
      let endCapsId = color === "black" ? "TRA034EC-41B" : "TRA034EC-41W";
      selectedItems.push({ id: endCapsId });

      // Добавляем блок питания
      let powerSupplyId = color === "black" ? "TRX034DR4-100B" : "TRX034DR4-100W";
      selectedItems.push({ id: powerSupplyId });

      // Остальной код для группировки и вывода результатов остается без изменений
      let groupedItems = {};
      selectedItems.concat(usedConnectors).forEach(itemObj => {
        let id = itemObj.id;
        if (!id) {
          console.warn("Обнаружен элемент без id:", itemObj);
          return;
        }
        let isTrack = itemObj.hasOwnProperty("pieceLength");
        if (!groupedItems[id]) {
          groupedItems[id] = { totalLength: 0, count: 0, component: components[id] || {}, isTrack: isTrack };
        }
        if (isTrack) {
          groupedItems[id].totalLength += itemObj.pieceLength;
        }
        groupedItems[id].count++;
      });

      let totalPrice = 0;
      let tbodyHTML = "";
      for (const [id, group] of Object.entries(groupedItems)) {
        let comp = group.component;
        if (comp && comp.name) {
          let qty = group.isTrack ? Math.ceil(group.totalLength / getNominalLength(id)) : group.count;
          let cost = qty * comp.price;
          totalPrice += cost;
          tbodyHTML += `
            <tr>
              <td><img src="images/maytoni_exility/${id}.jpeg" alt="${comp.name}" style="width:50px; height:auto; margin-right:10px;">${comp.name} ${id}</td>
              <td style="background-color: white; text-align: center;">${qty} шт.</td>
              <td>${comp.price}₽</td>
              <td>${cost}₽</td>
            </tr>
          `;
        } else {
          console.warn("Компонент с ID " + id + " не найден или не имеет имени.");
        }
      }

      document.getElementById("results").innerHTML = tbodyHTML;
      document.getElementById("totalPrice").innerHTML = `<div>Итого: ${totalPrice}₽</div>`;
      document.getElementById("resultContainer").style.display = "block";
      console.log("Подбор завершён успешно (Maytoni Exility).");
    };

    function getNominalLength(id) {
      if (id.includes("411")) return 100;
      if (id.includes("412") || id.includes("413")) return 200;
      if (id.includes("421") || id.includes("422") || id.includes("423")) return 200;
      return null;
    }

    function wrapConnector(conn) {
      return (typeof conn === "object" && conn !== null && conn.id !== undefined) ? conn : { id: conn };
    }

    function checkMountingForNovotech(mountingParam) {
      const validMountings = ["surface", "hanging", "recessed", "stretch-ceiling"];
      if (!validMountings.includes(mountingParam)) {
        document.getElementById("resultContainer").style.display = "none";
        document.getElementById("debug").textContent = "Для Maytoni Exility доступны режимы: " + validMountings.join(", ");
        return false;
      }
      return true;
    }

    window.safeShowSelection = function() {
      try {
        showSelection();
      } catch (e) {
        console.error("Ошибка в showSelection:", e);
        alert("Произошла ошибка при подборе. Проверьте консоль для подробностей.");
      }
    };

    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(window.safeShowSelection, 1000);
    });
  </script>
</body>
</html>
