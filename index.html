<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бренды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .brand-selector {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #f9f9f9;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
        }
        .brands-container {
            display: flex;
            flex-wrap: wrap;
            margin-top: 60px; /* Отступ для учета панели выбора брендов */
        }
        .brand {
            flex: 1;
            min-width: 200px;
            margin: 10px;
            padding: 20px;
            background: #e3e3e3;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: move;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="brand-selector">
    <strong>Выберите бренды для отображения:</strong><br>
    <label><input type="checkbox" value="brand1" checked> Бренд 1</label><br>
    <label><input type="checkbox" value="brand2" checked> Бренд 2</label><br>
    <label><input type="checkbox" value="brand3" checked> Бренд 3</label><br>
    <!-- Добавьте другие бренды по аналогии -->
</div>

<div class="brands-container">
    <div class="brand" id="brand1" draggable="true">Контент Бренда 1</div>
    <div class="brand" id="brand2" draggable="true">Контент Бренда 2</div>
    <div class="brand" id="brand3" draggable="true">Контент Бренда 3</div>
    <!-- Добавьте другие бренды по аналогии -->
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const brandsContainer = document.querySelector('.brands-container');
        const brands = document.querySelectorAll('.brand');
        const checkboxes = document.querySelectorAll('.brand-selector input[type="checkbox"]');

        // Функция для обработки начала перетаскивания
        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            e.target.style.opacity = '0.4';
        }

        // Функция для обработки окончания перетаскивания
        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        // Функция для обработки события перетаскивания над элементом
        function handleDragOver(e) {
            e.preventDefault();
            const draggingElement = document.querySelector('.dragging');
            const currentElement = e.target;
            const bounding = currentElement.getBoundingClientRect();
            const offset = bounding.y + (bounding.height / 2);
            if (e.clientY - offset > 0) {
                brandsContainer.insertBefore(draggingElement, currentElement.nextSibling);
            } else {
                brandsContainer.insertBefore(draggingElement, currentElement);
            }
        }

        // Добавляем обработчики событий для перетаскивания
        brands.forEach(function (brand) {
            brand.addEventListener('dragstart', handleDragStart);
            brand.addEventListener('dragend', handleDragEnd);
            brand.addEventListener('dragover', handleDragOver);
        });

        // Обработчики для чекбоксов
        checkboxes.forEach(function (checkbox) {
            checkbox.addEventListener('change', function () {
                const brandDiv = document.getElementById(this.value);
                if (this.checked) {
                    brandDiv.classList.remove('hidden');
                } else {
                    brandDiv.classList.add('hidden');
                }
            });
        });
    });
</script>

</body>
</html>
