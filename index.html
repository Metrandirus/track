<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бренды</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        #brandList {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f9f9f9;
            border: 1px solid #ccc;
            padding: 10px;
            width: 200px;
        }
        #brandTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 50px;
        }
        #brandTable th, #brandTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        #brandTable th {
            cursor: move;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<div id="brandList">
    <h3>Выберите бренды:</h3>
    <form id="brandForm">
        <label><input type="checkbox" name="brand" value="brand1" checked> Бренд 1</label><br>
        <label><input type="checkbox" name="brand" value="brand2" checked> Бренд 2</label><br>
        <label><input type="checkbox" name="brand" value="brand3" checked> Бренд 3</label><br>
        <!-- Добавьте дополнительные бренды по мере необходимости -->
    </form>
</div>

<table id="brandTable">
    <thead>
        <tr>
            <th data-brand="brand1">Бренд 1</th>
            <th data-brand="brand2">Бренд 2</th>
            <th data-brand="brand3">Бренд 3</th>
            <!-- Добавьте дополнительные заголовки колонок по мере необходимости -->
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Данные 1-1</td>
            <td>Данные 2-1</td>
            <td>Данные 3-1</td>
            <!-- Добавьте дополнительные ячейки данных по мере необходимости -->
        </tr>
        <tr>
            <td>Данные 1-2</td>
            <td>Данные 2-2</td>
            <td>Данные 3-2</td>
            <!-- Добавьте дополнительные ячейки данных по мере необходимости -->
        </tr>
        <!-- Добавьте дополнительные строки данных по мере необходимости -->
    </tbody>
</table>

<script>
    $(document).ready(function() {
        // Делает колонки перемещаемыми
        $("#brandTable thead tr").sortable({
            items: "th",
            cursor: "move",
            axis: "x",
            update: function(event, ui) {
                var newOrder = $(this).children().map(function() {
                    return $(this).data("brand");
                }).get();
                rearrangeColumns(newOrder);
            }
        });

        // Обработчик изменения состояния чекбоксов
        $("#brandForm input[type='checkbox']").change(function() {
            var brand = $(this).val();
            var isChecked = $(this).is(":checked");
            toggleColumn(brand, isChecked);
        });

        // Функция для перестановки колонок в соответствии с новым порядком
        function rearrangeColumns(order) {
            var $table = $("#brandTable");
            var $rows = $table.find("tr");

            $rows.each(function() {
                var $cells = $(this).children();
                var newCells = [];
                order.forEach(function(brand) {
                    var $cell = $cells.filter("[data-brand='" + brand + "'], th[data-brand='" + brand + "']");
                    newCells.push($cell);
                });
                $(this).append(newCells);
            });
        }

        // Функция для отображения или скрытия колонок
        function toggleColumn(brand, show) {
            var index = $("#brandTable th[data-brand='" + brand + "']").index();
            if (show) {
                $("#brandTable tr").each(function() {
                    $(this).children().eq(index).show();
                });
            } else {
                $("#brandTable tr").each(function() {
                    $(this).children().eq(index).hide();
                });
            }
        }
    });
</script>

</body>
</html>
